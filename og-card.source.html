<!DOCTYPE html><html><head><meta charset="utf-8"><style>
:root{--bg:#101317;--panel:#171b21;--fg:#e6e9ee;--dim:#8994a3;--hair:#242a33;--signal:#5b9dff;
--sans:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:var(--bg);color:var(--fg);font-family:var(--sans);
 display:flex;flex-direction:column;padding:66px 76px;
 background-image:radial-gradient(900px 420px at 85% 8%,rgba(91,157,255,.09),transparent 62%)}
.kick{font-family:var(--mono);font-size:15px;color:var(--signal);letter-spacing:.18em;text-transform:uppercase}
.name{font-size:52px;font-weight:500;letter-spacing:-.025em}
.role{font-size:23px;color:#c3cad4;font-weight:400}
.fig{font-family:var(--mono)}
.fig b{display:block;font-size:25px;color:var(--signal);font-variant-numeric:tabular-nums;font-weight:600}
.fig span{display:block;font-size:12.5px;color:var(--dim);letter-spacing:.06em;margin-top:6px}
.foot{font-family:var(--mono);font-size:15px;color:var(--dim);letter-spacing:.03em}
.foot b{color:var(--fg);font-weight:500}
body{justify-content:space-between;padding-left:0}
.bar{position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--signal)}
.pad{padding-left:76px}</style></head><body style="position:relative">
